<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Titan+One&display=swap" rel="stylesheet">
<style>
/* Layout: one app column. Menus are wide panels; games sit in a portrait stage (9:14) that fits the screen.
   Palettes are the three schemes from the sketch. Deep space background is a darkened c1 of each scheme. */
:root{
  --font-display:'Titan One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root,:root[data-mode="dark"],.scene{
  /* Nebula (blue + orange) */
  --c1:#3b4fb0; --c2:#5b73c8; --c3:#f2b97c; --c4:#f0923a;
  --bg:#0d1340; --bg2:#16226b; --panel:#1c2b84; --panel2:#2a3ca0; --line:#5b73c8;
  --g1:rgba(59,79,176,.55); --g2:rgba(91,115,200,.35);
  --ink:#f5f7ff; --dim:#b8c3f2; --hi:#f2b97c; --hot:#f0923a; --hazard:#f0923a;
  --go:#4fe08f; --go-ink:#06301a; --gold:#ffd34d;
  --chip:rgba(255,255,255,.1);--chip2:rgba(255,255,255,.16);--gotxt:#4fe08f;
}
:root[data-mode="light"]{
  color-scheme:light;
  --bg:#f4f6ff;--bg2:#e4e9ff;--panel:#ffffff;--panel2:#eaeeff;--line:#8f9fe0;
  --g1:rgba(91,115,200,.22);--g2:rgba(240,146,58,.16);
  --ink:#141a4a;--dim:#454f8a;--hi:#b84d00;--hot:#d9570f;--hazard:#b3340a;
  --chip:rgba(20,26,74,.08);--chip2:rgba(20,26,74,.14);--gotxt:#15803d;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--bg);
  color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 40px;min-height:100vh;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.bw{letter-spacing:.012em}
.bw b{font-weight:800}
.nobionic .bw b{font-weight:inherit}
.nobionic .bw .br{opacity:1}
.ic{width:20px;height:20px;fill:currentColor;flex:none}

/* ---------- top bar ---------- */
.top{max-width:1000px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.tl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumb{border:0;background:none;font:400 20px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink);padding:10px 4px;min-height:44px}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coins{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:0 14px 0 10px;min-height:44px;font-weight:800;font-variant-numeric:tabular-nums}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;border:0;border-radius:14px;background:var(--chip);font-weight:800;cursor:pointer;padding:0 12px}
.tb[aria-pressed="true"]{background:var(--hi);color:var(--bg)}
.screen{max-width:1000px;margin:0 auto}

/* ---------- buttons ---------- */
.btn{border:2px solid var(--line);background:var(--panel);color:var(--ink);font:600 15px var(--font-body);padding:10px 18px;border-radius:14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.h2{font:400 clamp(26px,5vw,36px)/1.05 var(--font-display);margin:0;text-wrap:balance}
.dim{color:var(--dim)}

/* ---------- title ---------- */

/* ---------- hub ---------- */
.hubhead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.herochip{display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:8px 24px 8px 14px;cursor:pointer;min-height:76px;min-width:230px}
.herochip svg{height:62px;width:42px;flex:none}
.herochip>span{display:grid;text-align:left;line-height:1.25;white-space:nowrap}
.herochip>span>b{font-size:19px}
.herochip small{color:var(--dim);font-size:14px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:780px){.games{grid-template-columns:minmax(0,1fr)}}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}

/* ---------- heroes ---------- */
.heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0 22px}
@media (max-width:700px){.heroes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hcard{display:grid;gap:6px;justify-items:center;text-align:center;background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:12px 10px 14px;cursor:pointer;min-width:0}
.hcard[aria-pressed="true"]{border-color:var(--hi);box-shadow:0 0 0 3px var(--hi);background:var(--panel2)}
.hcard .hs{display:block;height:130px}
.hcard .hs svg{height:100%;width:auto}
.hname{font:400 22px/1 var(--font-display)}
.hdesc{font-size:14px;color:var(--dim);line-height:1.3}
.skinrow{display:flex;flex-wrap:wrap;gap:12px}
.skin{position:relative;width:76px;display:grid;gap:4px;justify-items:center;border:0;background:none;cursor:pointer;padding:0;font-size:12px;font-weight:600}
.skin i{display:block;width:44px;height:44px;border-radius:50%;border:3px solid var(--rc,var(--ink));background:var(--sw)}
.skin .rt{color:var(--rc);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.skin[aria-pressed="true"] i{box-shadow:0 0 0 4px var(--hi)}
.skin[aria-pressed="true"] i{box-shadow:0 0 0 4px var(--hi)}
.skin.locked i{opacity:.55}
.skin .price{display:inline-flex;gap:3px;align-items:center;color:var(--gold)}

/* ---------- play stage ---------- */

/* ---------- match ---------- */

/* ---------- results + crate ---------- */
.results{max-width:560px;margin:0 auto;background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:22px 20px 24px;display:grid;gap:14px;justify-items:center;text-align:center;box-shadow:0 0 50px var(--g1)}
.stars3{display:flex;gap:8px}
.stars3 svg{width:56px;height:56px;fill:var(--chip2)}
.stars3 svg.on{fill:var(--gold);}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sumrow .tag{font-size:15px;padding:6px 14px}
.crate{border:0;background:none;cursor:pointer;display:grid;gap:6px;justify-items:center;padding:4px;color:var(--ink);font-weight:800}
.crate svg{width:110px;height:auto;}
.prize{background:var(--bg2);border:3px solid var(--hi);border-radius:18px;padding:12px 18px;display:grid;gap:4px;justify-items:center;min-width:220px}
.prize .rar{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.prize.jack{border-color:var(--gold);}
.prize>b.big{font:400 32px/1 var(--font-display);color:var(--gold)}
.prize i.sw{display:block;width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:var(--sw)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- teacher ---------- */
.tgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
@media (max-width:860px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;min-width:0}
.panel h3{font:700 13px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0}
.lesson{background:var(--bg2);border-radius:14px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.lrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lrow strong{overflow-wrap:anywhere}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:#55608f;position:relative;cursor:pointer;flex:none;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--go)}
.switch[aria-checked="true"] span{transform:translateX(22px)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--chip2);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.xbtn{border:0;background:none;color:var(--hazard);cursor:pointer;width:36px;height:36px;border-radius:8px;font-size:18px;font-weight:800}
.field{display:grid;gap:4px}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font-body)}
.field textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;resize:vertical}
.seg{display:inline-flex;background:var(--chip);padding:4px;border-radius:999px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font:600 14px var(--font-body);padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--hi);color:var(--bg)}
.msg{margin:0;font-size:14px;min-height:20px}
.msg.ok{color:var(--go)}.msg.err{color:var(--hazard)}
.help{margin:0;font-size:13px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:600;padding:10px 18px;border-radius:14px;z-index:50;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.newbig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:3px dashed var(--line);background:transparent;border-radius:18px;font:600 19px var(--font-body);color:var(--ink);cursor:pointer}
.newbig .plus{font:400 30px/1 var(--font-display);color:var(--hi)}
.lname{font-size:18px}
.edtips{margin:0 0 14px}
.bigin{font-size:20px!important;font-weight:600;min-height:52px!important}
.qcard{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;min-width:0}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font:400 20px var(--font-display)}
.qstate{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;flex:1 1 auto;min-width:0}
.qstate.good{color:var(--go);flex:0 0 auto}
.qstate.bad{color:var(--hazard)}
.qtools{display:flex;gap:6px;margin-left:auto}
.qcard textarea{font-family:var(--font-body)!important;font-size:19px!important;font-weight:600;line-height:1.4!important}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;align-items:stretch;gap:0;border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);min-width:0}
.opt.right{border-color:var(--go);box-shadow:0 0 0 2px var(--go)}
.opt .shape{width:46px;flex:none;display:grid;place-items:center}
.opt .shape svg{width:22px;height:22px}
.opt input{flex:1;min-width:0;border:0!important;border-radius:0!important;background:transparent!important;font-size:19px!important;font-weight:600;padding:10px 10px!important}
.opt input:focus-visible{outline-offset:-3px}
.tick{width:52px;flex:none;border:0;border-left:3px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.tick svg{width:26px;height:26px;opacity:.35}
.tick[aria-pressed="true"]{background:var(--go);color:var(--go-ink)}
.tick[aria-pressed="true"] svg{opacity:1}

.go{border:0;background:var(--go);color:var(--go-ink);font:400 clamp(24px,5vw,30px)/1 var(--font-display);padding:14px 40px;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);min-height:56px}
.go.sm{font-size:20px;padding:10px 26px;min-height:48px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}


/* ---------- title scene (decoration lives only here) ---------- */
.scene{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;border:3px solid var(--line);background:linear-gradient(180deg,var(--bg) 0%,#1a2a8f 62%,#3b4fb0 100%);color:var(--ink);min-height:min(80vh,660px);display:grid;place-items:center;padding:40px 16px 170px;text-align:center}
.scene .deco{position:absolute;z-index:-1;pointer-events:none}
.scene .stars{inset:0;width:100%;height:100%}
.scene .planet{left:-60px;top:-50px;width:clamp(170px,32vw,300px)}
.scene .planet2{right:21%;bottom:33%;width:clamp(56px,10vw,100px)}
.scene .rocket{right:6%;top:9%;width:clamp(62px,11vw,108px);transform:rotate(22deg)}
.scene .tile{width:clamp(44px,8vw,68px);height:clamp(44px,8vw,68px);border-radius:16px;display:grid;place-items:center;font:400 clamp(26px,5vw,40px)/1 var(--font-display);color:var(--go-ink);background:var(--go)}
.scene .t1{left:9%;top:44%;transform:rotate(-12deg)}
.scene .t2{right:10%;top:44%;transform:rotate(10deg);background:var(--hi);color:var(--bg)}
.scene .t3{left:17%;top:62%;transform:rotate(8deg);background:#fff;color:var(--c1)}
.scene .t4{right:22%;top:16%;transform:rotate(-8deg);background:var(--c2);color:#fff}
.scene .hatch{bottom:150px;width:clamp(80px,16vw,140px)}
.scene .hatch.l{left:2%}.scene .hatch.r{right:2%;transform:scaleX(-1)}
.scene .hills{left:0;right:0;bottom:0;width:100%;height:150px}
.scene .crew{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,1.6vw,18px);z-index:1}
.scene .crew svg{width:clamp(46px,11vw,92px);height:auto;display:block}
.scene .logo{color:var(--hi);text-shadow:0 5px 0 #7a3b00,0 0 0 var(--bg);-webkit-text-stroke:3px var(--bg);paint-order:stroke fill}
.scene .tagline{color:#e6ebff}
.scene .go.big{box-shadow:0 7px 0 #1a7a45}
@media (prefers-reduced-motion:no-preference){
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
  .scene .rocket,.scene .planet2{animation:fl 4.5s ease-in-out infinite}
  .scene .tile{animation:fl 5s ease-in-out infinite}
  .scene .t2{animation-delay:-1.2s}.scene .t3{animation-delay:-2.4s}.scene .t4{animation-delay:-3.4s}
  .scene .crew svg{animation:bob 2.6s ease-in-out infinite}
  .scene .crew svg:nth-child(2n){animation-delay:-.9s}.scene .crew svg:nth-child(3n){animation-delay:-1.7s}
}

@media (max-width:560px){.scene .t1,.scene .t2{display:none}.scene .t3{left:6%;top:66%}.scene .planet2{right:8%;bottom:30%}}

/* ---------- collection ---------- */
.skin.pet{width:92px}
.pimg{display:block;width:64px;height:64px;border-radius:18px;background:var(--bg2);border:3px solid var(--rc,var(--line));padding:4px}
.pimg svg{width:100%;height:100%;display:block}
.pimg.big{width:96px;height:96px}
.skin.pet[aria-pressed="true"] .pimg{box-shadow:0 0 0 4px var(--hi)}
.skin.pet.locked .pimg{opacity:.55}
.own{color:var(--gotxt);font-weight:700;font-size:12px}
i.sw.big{display:block;width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:var(--sw)}
.colic svg{width:40px;height:40px;fill:var(--hi)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:14px}
.pcard{position:relative;aspect-ratio:3/4.1;border:4px solid var(--rc);border-radius:16px;background:var(--panel);display:grid;grid-template-rows:auto 1fr auto;gap:4px;padding:8px;min-width:0;overflow:hidden}
.pcard .ch{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pcard .cn{font-size:14px;font-weight:800;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.pcard .cno{font-size:11px;color:var(--dim);font-weight:700}
.pcard .cart{border-radius:10px;background:color-mix(in srgb,var(--tc) 22%,var(--bg2));display:grid;place-items:center;padding:4px;min-height:0}
.pcard .cart svg{width:88%;height:auto;max-height:100%}
.pcard .cf{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800}
.pcard .ctype{background:var(--tc);color:#fff;border-radius:999px;padding:1px 9px}
.pcard .crar{color:var(--rc);text-transform:uppercase;letter-spacing:.04em}
.pcard .cx{position:absolute;right:8px;top:30px;background:var(--hi);color:var(--bg);font-weight:800;font-size:12px;border-radius:999px;padding:0 8px}
.pcard.miss{border-color:var(--line);opacity:.75}
.pcard.miss .cart svg{filter:brightness(0) opacity(.35)}
.pcard.miss .ctype{background:var(--chip2);color:var(--dim)}
.pcard.miss .crar{color:var(--dim)}
.cardprize{display:grid;gap:8px;justify-items:center}
.cardprize .pcard{width:170px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,30,.62);display:grid;place-items:center;padding:20px}
.mbox{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:24px 22px;max-width:360px;width:100%;display:grid;gap:12px;text-align:center;justify-items:center}
.mbox h3{font:400 28px/1.1 var(--font-display);margin:0}
.mbox p{margin:0}

.bstage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 20% 15%,var(--chip2) 0 2px,transparent 3px),radial-gradient(circle at 75% 40%,var(--chip2) 0 2px,transparent 3px),radial-gradient(circle at 45% 70%,var(--chip2) 0 2px,transparent 3px)}
.ast{position:absolute;top:0;border:0;border-radius:50%;color:#fff;font-family:var(--font-display);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18);transition:opacity .2s,filter .2s}
.ast.a0{background:#3b4fb0}.ast.a1{background:#7a4fb0}.ast.a2{background:#b0503b}.ast.a3{background:#2f8a8f}
.ast.no{opacity:.25;pointer-events:none}.ast.gone{opacity:0;pointer-events:none}
.ast.ok{background:var(--go);color:var(--go-ink)}.ast.boom{opacity:0;filter:brightness(2);transition:opacity .25s}
.rocket{position:absolute;bottom:8px;left:50%;width:38px;height:54px;margin-left:-19px;transition:left .12s ease-out}
.bolt{position:absolute;bottom:62px;width:6px;margin-left:-3px;border-radius:3px;background:var(--go)}
.spark{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--go);animation:sp .55s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.bw .br{opacity:var(--bdim,.7)}
.coach{max-width:420px!important;text-align:left;justify-items:stretch!important;gap:10px!important}
.coach h3{font-size:30px!important;text-align:center}
.coach p{font-size:16px!important}
.coach p.cq{font:400 28px/1.2 var(--font-display)!important;text-align:center}
.coach .cpick{color:var(--dim)}
.coach .cwhy{background:var(--chip);border-radius:12px;padding:10px 12px;font-weight:600}
.coach .chow{border-left:5px solid var(--go);padding-left:10px}
.coach .cansw{text-align:center;color:var(--dim)}
.coach .go{justify-self:center}
.ovl{overflow:auto}
.dots{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;margin:6px 0}
.dots .grp{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:150px}
.dots.rows{flex-direction:column;gap:4px}

function drawQs(n,unique,maxLen){
  const P0=()=>pool().filter(x=>!maxLen||x.text.length<=maxLen);
  let bag=P0(),out=[],used={},guard=0;
  if(!bag.length)return out;
  while(out.length<n&&guard++<300){
    if(!bag.length)bag=P0();
    const ws=bag.map(wgt),sum=ws.reduce((a,b)=>a+b,0);let r=Math.random()*sum,i=0;
    for(;i<bag.length;i++){r-=ws[i];if(r<=0)break}
    i=Math.min(i,bag.length-1);
    const x=bag.splice(i,1)[0];
    if(unique&&used[x.answer])continue;
    used[x.answer]=1;out.push(Object.assign({},x));
  }

}
function choicesFor(x,k){

}

const SUBW=/\b(left|away|gave|gives|lost|ate|eats|fewer|remain|remains|took|sold|spent|uses|used|broke)\b/i;
const MULW=/\b(each|every|per|groups?|bags?\s+of)\b/i;
const ADDW=/\b(more|in all|altogether|total|together|and|gets|joins|finds|both)\b/i;
function opOf(t){
  t=String(t||'');
  let m=t.match(/^\s*(\d+)\s*([+\-−×x*÷\/])\s*(\d+)\s*$/);
  if(m){const o=m[2];return{a:+m[1],b:+m[3],op:o==='-'||o==='−'?'−':(o==='x'||o==='*'||o==='×')?'×':o==='+'?'+':'÷',kw:''}}
  const n=(t.match(/\d+/g)||[]).map(Number);
  if(n.length<2)return null;
  let k;
  if(k=t.match(SUBW))return{a:n[0],b:n[1],op:'−',kw:k[0].toLowerCase(),word:1};
  if(k=t.match(MULW))return{a:n[0],b:n[1],op:'×',kw:k[0].toLowerCase(),word:1};
  if(k=t.match(ADDW))return{a:n[0],b:n[1],op:'+',kw:k[0].toLowerCase(),word:1};
  return null;
}
const OPN={'+':'adding','−':'taking away','×':'groups','÷':'sharing'};
const OPHOW={'+':'Start at the big number. Count on.','−':'Start at the big number. Count back.','×':'Count by the group size.','÷':'Share one at a time.'};
function explain(q,picked,kind){
  const info=opOf(q.text),ans=Number(q.answer),p=Number(picked);
  let why='',how='';
  if(q.why)why=q.why;
  else if(kind==='miss')why='Time ran out. That is okay!';
  else if(kind==='wasRight')why='That number was right. Solve it first.';
  else if(info&&isFinite(p)&&isFinite(ans)&&picked!==''&&picked!=null){
    const {a,b,op,kw,word}=info,alt={'+':a+b,'−':a-b,'×':a*b};
    const hit=['+','−','×'].filter(o=>o!==op&&alt[o]===p&&p!==ans)[0];
    if(hit)why='That is from '+OPN[hit]+'. This needs '+OPN[op]+(kw?'. Clue: "'+kw+'".':'. Check the sign.');
    else if(p===a||p===b)why='That is a number from the question. Finish the problem.';
    else if(Math.abs(p-ans)===1)why='So close! Off by one. Do not count the number you start on.';
    else if(Math.abs(p-ans)===10)why='The ones are right. Check the tens.';
    else why='Too far. Count it out with dots.';
  }else why='Not this one. Read it again, slowly.';
  how=q.hint?(q.hint+'.'):(info?OPHOW[info.op]:'Say it in your own words.');
  return{why,how,info};
}

}

function lessonEx(l,L,fresh){
  const e=L.ex||{text:'6 + 3',a:6,b:3,op:'+',say:''};

  if(op==='+'){a=rint(3,9);b=rint(2,6)}else if(op==='−'){a=rint(8,14);b=rint(2,6)}else{a=rint(2,4);b=rint(2,5)}

}

function lineFor(e,S0){return S0.word?'Clue word first. Then add, take away or groups.':sayFor(e)}
function animate(e,icon,icon2){
  clearLT();ICON=icon||'';ICON2=icon2||'';const host=$('#lstage'),cnt=$('#lcount');if(!host)return;
  const {a,b,op}=e;let k=0;
  const fin=r=>{cnt.textContent=r;cnt.classList.add('pop')};
  cnt.classList.remove('pop');
  if(op==='+'){
    host.innerHTML='<span class="grp">'+LD(a,'a')+'</span><span class="grp" id="g2"></span>';cnt.textContent=a;
    LT.push(setInterval(()=>{if(k<b){k++;$('#g2').insertAdjacentHTML('beforeend',one('b'));cnt.textContent=a+k}else{clearInterval(LT[0]);fin(a+b);
      if(a<10&&a+b>10&&a+b<=20)LT.push(setTimeout(()=>{host.innerHTML='<span class="grp tenbox">'+LD(10,'a')+'</span><span class="grp">'+LD(a+b-10,'b')+'</span>';const ln=$('#cline')||$('#lline');if(ln)ln.textContent='10 and '+(a+b-10)+' more.'},900))}},520));
  }else if(op==='\u2212'){
    host.innerHTML='<span class="grp">'+LD(a,'a')+'</span>';cnt.textContent=a;
    LT.push(setInterval(()=>{if(k<b){k++;host.querySelectorAll('.dt')[a-k].classList.add('x');cnt.textContent=a-k}else{clearInterval(LT[0]);fin(a-b)}},520));
  }else{
    host.innerHTML='<span class="grp col" id="g2"></span>';cnt.textContent=0;
    LT.push(setInterval(()=>{if(k<a){k++;$('#g2').insertAdjacentHTML('beforeend','<span class="grp in">'+LD(b,k%2?'a':'b')+'</span>');cnt.textContent=k*b}else{clearInterval(LT[0]);fin(a*b)}},800));
  }
}
function buildTap(e){
  const host=$('#lstage'),{a,b,op}=e;
  if(op==='+')host.innerHTML='<span class="grp">'+LD(a,'a')+'</span><span class="grp">'+Array.from({length:b},()=>'<button class="dt big hole" data-act="ltap" aria-label="Count on"></button>').join('')+'</span>';
  else if(op==='−')host.innerHTML='<span class="grp">'+Array.from({length:a},(_,i)=>'<button class="dt big a'+(i>=a-b?' tgt':'')+'" data-act="ltap" data-i="'+i+'" aria-label="Take away"></button>').join('')+'</span>';

function ltap(t){
  const e=LS.ex2,cnt=$('#lcount');if(!e||t.dataset.done)return;
  t.dataset.done='1';LS.n++;

  else if(e.op==='−'){t.classList.add('x');cnt.textContent=e.a-LS.n}
  else{t.classList.add('on');cnt.textContent=LS.n*e.b}
  beep('tick');
  if(LS.n>=(e.op==='+'?e.b:e.op==='−'?e.b:e.a)){
    const r=e.op==='+'?e.a+e.b:e.op==='−'?e.a-e.b:e.a*e.b;cnt.classList.add('pop');

let PR=null;
function startPractice(qs,title,back,lid){
  if(!qs.length){toast('No questions to practice yet.');return}
  PR={qs,i:0,right:0,tries:0,title,back,lid,done:false,locked:false,first:0};renderPractice();
}
function renderPractice(){
  const P=PR;if(!P)return;
  if(P.i>=P.qs.length){
    const bonus=P.first>=P.qs.length-1?5:0,coins=5+bonus;S.coins+=coins;const st=P.first>=P.qs.length?3:P.first>=P.qs.length-1?2:1;if(P.lid)S.learn[P.lid]=Math.max(S.learn[P.lid]||0,st);countCalm();save();setTop();
    $('#main').innerHTML='<section class="screen narrow"><div class="results"><h2 class="h2">'+(P.first>=P.qs.length-1?'Super practice!':'Nice work!')+'</h2><p>'+P.first+' of '+P.qs.length+' right on the first try.</p>'+(P.lid?'<div class="tstars big">'+starsRow(st)+'</div>':'')+'<div class="sumrow"><span class="tag">+'+coins+' coins</span></div><div class="btnrow"><button class="go" data-act="'+P.back+'">Done</button></div></div></section>';return;
  }
  const q=P.qs[P.i],ch=P.ch||(P.ch=choicesFor(q,4));
  $('#main').innerHTML='<section class="screen narrow"><div class="hubhead"><h2 class="h2">'+esc(P.title)+'</h2><button class="btn sm" data-act="'+P.back+'">Stop</button></div>'+
   '<div class="pdots" aria-label="Question '+(P.i+1)+' of '+P.qs.length+'">'+P.qs.map((_,k)=>'<i class="'+(k<P.i?'d':k===P.i?'c':'')+'"></i>').join('')+'</div>'+
   '<div class="panel prac"><p class="pbig">'+qHTML(q)+'</p>'+(q.pic?'<div class="qpic">'+dotsQ(q.pic,q,true)+'</div>':'')+'<button class="btn sm" data-act="speakq">Listen</button><div class="pch">'+ch.map(c=>'<button class="pc" data-act="pans" data-v="'+esc(c)+'" data-nb>'+esc(c)+'</button>').join('')+'</div><div id="pfeed" role="status" aria-live="polite"></div></div></section>';
}
function pans(btn){
  const P=PR;if(!P||P.locked)return;const q=P.qs[P.i],v=btn.dataset.v,feed=$('#pfeed');
  if(v===q.answer){
    P.locked=true;btn.classList.add('ok');if(!P.tries){P.first++;if(S.mistakes&&S.mistakes[q.key]){delete S.mistakes[q.key]}}
    mark(q,P.tries>0);const ex=opOf(q.text);
    feed.innerHTML='<div class="fb good"><b>Yes! '+esc(q.answer)+'.</b>'+(ex?dotsQ(ex,q):'')+'</div><div class="btnrow"><button class="go sm" data-act="pnext" id="gobtn">'+(P.i+1>=P.qs.length?'Finish':'Next')+'</button></div>';
    const g=$('#gobtn');if(g)g.focus();save();
  }else{
    P.tries++;btn.classList.add('no');btn.disabled=true;mark(q,true);
    const ex=explain(q,v,'');logMistake(q,v,ex);save();
    P.ex=ex;const inf=ex.info;feed.innerHTML='<div class="fb bad">'+(inf?'<div class="lstage" id="lstage"></div><p class="lcount" id="lcount" data-nb></p><p class="cline">'+esc(coachLine(inf))+'</p>':'<p>'+esc(ex.why)+'</p><p>'+esc(ex.how)+'</p>')+'<div class="btnrow">'+(inf?'<button class="btn sm" data-act="pshow">Again</button>':'')+'<button class="btn sm" data-act="pskip">Next question</button></div></div>';if(inf)animate(inf,q.pic&&q.pic.ic,q.pic&&q.pic.ic2);
  }
}

const SC={stage:'start',items:[],name:'My worksheet',gen:true,only:true,ai:true,msg:'',pct:0,raw:'',typing:false};
const OPCH='+−×÷';
function sheetHint(a,op,b){
  return op==='+'?'Start at '+Math.max(a,b)+' and count on '+Math.min(a,b):op==='−'?'Count back '+b+' from '+a:op==='×'?'Count by '+a+'s, '+b+' times':'Share '+a+' into groups of '+b;
}
function parseSheet(raw){
  const items=[],seen=new Set();
  const t=String(raw||'').replace(/[–—−]/g,'−').replace(/[✕✖]/g,'×');
  const lines=t.split(/\r?\n/).map(l=>l.replace(/[|,;:'`~]/g,' ').replace(/\s+/g,' ').trim());
  const exprLine=/^[\d\s+−\-×xX*÷=_?□().\[\]]+$/;
  let buf='';
  const flush=()=>{
    let p=buf.trim();buf='';if(!p||p.indexOf('?')<0)return;
    const parts=p.split('?').map(x=>x.trim()).filter(Boolean);
    parts.forEach(seg=>{
      seg=seg.replace(/^(?:.*\s)?\(?\d{1,2}[.)]\s+(?=[A-Za-z0-9])/,'').trim();
      const n=seg.match(/\d+/g)||[];if(n.length<2||seg.length>150||seg.length<12)return;
      const info=opOf(seg);let ans='';
      if(info){const nums=n.map(Number);
        if(info.op==='+')ans=nums.reduce((x,y)=>x+y,0);
        else if(info.op==='−'&&nums[0]>=nums[1])ans=nums[0]-nums[1];
        else if(info.op==='×')ans=nums[0]*nums[1];}
      const text=seg.replace(/[_□]+/g,'').trim()+'?';
      if(seen.has(text))return;seen.add(text);
      items.push({text,answer:ans===''?'':String(ans),hint:info?(info.kw?'Clue word: '+info.kw:''):'',on:ans!=='',kind:'word',op:info?info.op:''});
    });
  };
  lines.forEach(line=>{
    if(/\d/.test(line)&&/[+\u2212\-\u00d7xX*\u00f7]/.test(line)&&!/[A-Za-z]{3}/.test(line)&&(line.match(/[A-Za-z]/g)||[]).length<=3)line=line.replace(/[BOoIlSZGgq]/g,c=>({B:'8',O:'0',o:'0',I:'1',l:'1',S:'5',Z:'2',G:'6',g:'9',q:'9'})[c]);
    const stripped=line.replace(/^\(?\d{1,2}[.)]\s+/,'');
    if(exprLine.test(stripped)&&/\d/.test(stripped)&&/[+−\-×xX*÷]/.test(stripped)){
      flush();
      const re=/(?<![\d.])(\d{1,3})\s*([+−\-×xX*÷])\s*(\d{1,3})(?![\d.])/g;let m;
      while((m=re.exec(stripped))){
        const a=+m[1],b=+m[3];let op=m[2];
        op=op==='-'||op==='−'?'−':(op==='x'||op==='X'||op==='*'||op==='×')?'×':op;
        let r;
        if(op==='+')r=a+b;else if(op==='−'){if(a<b)continue;r=a-b}else if(op==='×')r=a*b;else{if(!b||a%b)continue;r=a/b}
        if(r>1000)continue;
        const text=a+' '+op+' '+b;if(seen.has(text))continue;seen.add(text);
        items.push({text,answer:String(r),hint:sheetHint(a,op,b),on:true,kind:'sum',op,a,b});
      }
    }else if(!line){flush()}
    else{buf+=(buf?' ':'')+line;if(/\?$/.test(line))flush()}
  });
  flush();
  return items.slice(0,40);
}
function detectGen(items){
  const on=items.filter(i=>i.on);if(!on.length)return '';
  const cnt={};on.forEach(i=>{const k=i.kind==='word'?'word':i.op;cnt[k]=(cnt[k]||0)+1});
  const top=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
  if(cnt[top]/on.length<.6)return '';
  const sums=on.filter(i=>i.kind==='sum'&&i.op===top);
  if(top==='word')return 'word';
  if(top==='+')return sums.filter(i=>i.a>20||i.b>20).length>sums.length*.3?'add100':'add';
  if(top==='−')return sums.filter(i=>i.a>20).length>sums.length*.3?'':'sub';
  if(top==='×')return sums.every(i=>Math.min(i.a,i.b)<=5||[i.a,i.b].every(v=>v===2||v===5))?(sums.every(i=>[i.a,i.b].some(v=>v===2||v===5))?'mul':'mul10'):'mul10';
  return '';
}

function loadImage(file){

function toCanvas(im,max,gray){
  const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
  if(gray){
    const d=x.getImageData(0,0,w,h),p=d.data,hist=new Array(256).fill(0);
    for(let i=0;i<p.length;i+=4){const g=Math.round(.3*p[i]+.59*p[i+1]+.11*p[i+2]);p[i]=p[i+1]=p[i+2]=g;hist[g]++}
    const tot=w*h;let lo=0,hi=255,a=0;
    for(;lo<255&&(a+=hist[lo])<tot*.02;lo++);a=0;for(;hi>0&&(a+=hist[hi])<tot*.02;hi--);
    const sc=255/Math.max(40,hi-lo);
    for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(p[i]-lo)*sc));p[i]=p[i+1]=p[i+2]=v}
    x.putImageData(d,0,0);
  }
  return c;
}

}

}

function startRound(mode,skipReady){
  stopRound();
  if(!drawQs(1,false).length){toast('Turn on a topic in Scan first.');renderHub();return}
  const H=HEROES[S.hero];
  S.lastMode=mode;const calm=S.timer==='calm',two=S.timer==='120';
  document.documentElement.classList.remove('unlocked');
  R={mode,H,calm,t:0,limit:calm?99999:(two?120:60)+(H.time||0)*(two?2:1),score:0,combo:0,maxCombo:0,level:Math.min(8,H.lv||1),correct:0,wrongN:0,missed:[],coins:0,free:H.free||0,paused:true,over:false,lastKey:'',sayUntil:0,hud:{}};

const stopGame=stopRound;
function loop(ts){
  if(!R)return;
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  if(!R.paused&&!R.over){
    R.t+=dt;engine.update(dt);
    if(R.calm){if(R.correct>=CALM_N&&!R.paused){endRound();return}}
    else if(R.t>=R.limit){endRound();return}
  }
  if(engine.draw)engine.draw();

}

  const w=R.calm?Math.min(100,100*R.correct/CALM_N):Math.max(0,100*(1-R.t/R.limit));$('#pfill').style.width=w+'%';
  if(R.sayUntil&&R.t>R.sayUntil){R.sayUntil=0;const f=$('#pfb');f.textContent='';f.className='pfb'}
}

}

const goalOf=r=>GOAL[r.mode]*(r.limit>90&&r.limit<9999?2:1);
function endRound(){
  const r=R;r.over=true;
  const goal=goalOf(r),stars=r.calm?(r.wrongN===0?3:r.wrongN<=2?2:1):(r.correct>=goal*1.5?3:r.correct>=goal?2:1);
  const prev=S.best[r.mode]||0,newBest=!r.calm&&S.timer!=='120'&&r.score>prev&&r.correct>0;
  if(newBest)S.best[r.mode]=r.score;
  const coins=Math.round(r.coins*(r.H.cm||1))+[0,0,10,20][stars];
  S.coins+=coins;countCalm();save();
  const sum={mode:r.mode,score:r.score,correct:r.correct,stars,best:S.best[r.mode]||0,newBest,coins,missed:r.missed.slice(0,6),maxCombo:r.maxCombo,calm:r.calm};
  stopRound();renderResults(sum);
}

/* ================= Game 1: Blast (asteroids) ================= */
function dash(){
  const arena=$('#arena');arena.innerHTML='<div class="bstage" id="bstage"><div class="rocket" id="rkt"><svg viewBox="0 0 40 56" aria-hidden="true"><path d="M20 2c8 8 10 20 8 34H12C10 22 12 10 20 2z" fill="#fff"/><circle cx="20" cy="20" r="5" fill="#3b4fb0"/><path d="M12 30l-8 12 8-3zM28 30l8 12-8-3z" fill="#f07b3f"/><path d="M15 38h10l-5 14z" fill="#ffb347"/></svg></div></div>';
  const st=$('#bstage'),rk=$('#rkt');
  let ah=500,aw=360,set=null,fx=0;
  function size(){aw=arena.clientWidth;ah=arena.clientHeight}
  window.addEventListener('resize',size);size();
  const D=()=>Math.round(clamp(aw/5.2,58,92));
  function spawn(){
    const q=nextQ(),ch=choicesFor(q,4),n=ch.length,d=D(),slot=aw/n,els=[];
    ch.forEach((t,i)=>{
      const b=document.createElement('button');b.className='ast a'+(i%4);b.dataset.nb='';b.dataset.t=t;b.dataset.i=i;
      b.style.width=b.style.height=d+'px';b.style.left=Math.round(slot*i+slot/2-d/2)+'px';
      b.style.fontSize=(t.length>5?15:t.length>3?20:28)+'px';b.setAttribute('aria-label','Answer '+t);b.textContent=t;
      b.dataset.off=Math.round(Math.random()*d*.9);st.appendChild(b);els.push(b);
    });
    set={q,els,y:-d*1.6,res:false,wrong:false,corr:ch.indexOf(q.answer),d};
    setQ(q);
  }
  function burst(x,y){
    for(let k=0;k<9;k++){
      const p=document.createElement('i');p.className='spark';const a=k/9*6.283,r=40+Math.random()*30;
      p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',Math.cos(a)*r+'px');p.style.setProperty('--dy',Math.sin(a)*r+'px');
      st.appendChild(p);setTimeout(()=>p.remove(),600);
    }
  }
  function zap(el){
    const d=set.d,x=el.offsetLeft+d/2,y=parseFloat(el.dataset.y||0)+d/2;
    rk.style.left=x+'px';
    const bolt=document.createElement('i');bolt.className='bolt';bolt.style.left=x+'px';bolt.style.height=Math.max(0,ah-y-60)+'px';
    st.appendChild(bolt);setTimeout(()=>bolt.remove(),180);burst(x,y);
  }
  function pick(el){
    if(!set||set.res||R.paused||el.classList.contains('no'))return;
    const s=set;
    if(el.dataset.t===s.q.answer){
      s.res=true;zap(el);el.classList.add('boom');
      s.els.forEach(o=>{if(o!==el)o.classList.add('gone')});
      good(s.q,s.wrong);fx=R.t+.28;
    }else{
      el.classList.add('no');s.wrong=true;
      bad(s.q,'Not that one. '+(s.q.hint||'Try another rock!'),el.dataset.t);
    }
  }
  st.addEventListener('pointerdown',e=>{const b=e.target.closest('button.ast');if(b)pick(b)});
  spawn();
  return{
    destroy(){window.removeEventListener('resize',size)},
    dbg(){return set&&!set.res?{ans:set.q.answer,col:set.corr}:null},
    key(e){
      const c={'1':0,'2':1,'3':2,'4':3}[e.key];if(c===undefined)return false;
      if(set&&set.els[c])pick(set.els[c]);return true;
    },
    update(dt){
      if(set.res){
        if(R.t>=fx){set.els.forEach(o=>o.remove());spawn()}
        return;
      }
      const T=Math.max(2.6,(7-.5*R.level)/S.pace),floor=ah-92,vy=(floor+set.d*1.6)/T;
      if(R.calm)set.y=Math.min(ah*.2,set.y+ah*1.4*dt);else set.y+=vy*dt;
      set.els.forEach(o=>{const y=set.y+(+o.dataset.off);o.dataset.y=y;o.style.transform='translateY('+y+'px)'});
      if(!R.calm&&set.y>=floor-set.d*.9){
        set.res=true;fx=R.t+.9;
        const o=set.els[set.corr];o.classList.add('ok');set.els.forEach(z=>{if(z!==o)z.classList.add('gone')});
        bad(set.q,'Too late. The answer was '+set.q.answer+'.',null,'miss');
      }
    }
  };
}

/* ================= Game 2: Tiles (piano-tiles style) ================= */
function tiles(){
  const arena=$('#arena');arena.innerHTML='<div class="tstage" id="tstage"><div class="floor"></div></div>';
  const st=$('#tstage');
  let rows=[],rowH=100,ah=500,aw=360,cur=null,nudge=0;
  function size(){aw=arena.clientWidth;ah=arena.clientHeight;rowH=Math.max(80,Math.round(ah/4.4));rows.forEach(rw=>{rw.el.style.height=rowH+'px'})}
  window.addEventListener('resize',size);size();
  function mkRow(y){
    const q=nextQ(),ch=choicesFor(q,4),pos=shuffle([0,1,2,3]).slice(0,ch.length);
    const el=document.createElement('div');el.className='trow';el.style.height=rowH+'px';
    let h='';
    for(let c=0;c<4;c++){
      const i=pos.indexOf(c);
      if(i<0)h+='<span class="tile blank"></span>';
      else{const t=ch[i];h+='<button class="tile" data-nb data-c="'+c+'" data-t="'+esc(t)+'" style="font-size:'+(t.length>5?16:t.length>3?22:30)+'px" aria-label="Answer '+esc(t)+'">'+esc(t)+'</button>'}
    }
    el.innerHTML=h;st.appendChild(el);
    return{el,q,corr:pos[ch.indexOf(q.answer)],y,res:false,wrong:false};
  }
  const active=()=>rows.find(r=>!r.res);
  function tapTile(btn,row){
    if(btn.classList.contains('no')||row.res)return;
    if(btn.dataset.t===row.q.answer){row.res=true;btn.classList.add('ok');row.el.classList.add('done');good(row.q,row.wrong)}
    else{btn.classList.add('no');row.wrong=true;bad(row.q,'Not that one. '+(row.q.hint||'Try another tile!'),btn.dataset.t)}
  }
  st.addEventListener('pointerdown',e=>{
    const btn=e.target.closest('button.tile');if(!btn||R.paused)return;
    const row=rows.find(r=>r.el.contains(btn)),a=active();if(!row)return;
    if(row!==a){if(!row.res&&R.t>nudge){nudge=R.t+2;say('Start with the bottom row.','hint',1500)}return}
    tapTile(btn,row);
  });
  return{
    destroy(){window.removeEventListener('resize',size)},
    dbg(){const a=active();return a?{ans:a.q.answer,col:a.corr}:null},
    key(e){
      const m={'1':0,'2':1,'3':2,'4':3,d:0,D:0,f:1,F:1,j:2,J:2,k:3,K:3},c=m[e.key];
      if(c===undefined)return false;
      const a=active();if(!a)return true;
      const btn=a.el.querySelector('button[data-c="'+c+'"]');if(btn)tapTile(btn,a);
      return true;
    },
    update(dt){
      if(R.calm){const a0=active(),tgt=ah-rowH*1.4;if(a0&&a0.y<tgt){const mv=Math.min(tgt-a0.y,rowH*7*dt);rows.forEach(rw=>{rw.y+=mv})}}
      else{const T=Math.max(1,(4.2-.4*R.level)/S.pace),vy=rowH/T;rows.forEach(rw=>{rw.y+=vy*dt})}
      while(!rows.length||rows[rows.length-1].y>=0){
        rows.push(mkRow(rows.length?rows[rows.length-1].y-rowH:ah-rowH*1.4));
      }
      const a=active();
      if(!R.calm&&a&&a.y+rowH>=ah+2){
        a.res=true;a.el.classList.add('done');
        const b=a.el.querySelector('button[data-c="'+a.corr+'"]');if(b)b.classList.add('ok');
        bad(a.q,'Missed it. The answer was '+a.q.answer+'.',null,'miss');
      }
      const act=active();
      if(act&&act!==cur){cur=act;setQ(act.q)}
      rows.forEach(rw=>{rw.el.style.transform='translateY('+rw.y+'px)';rw.el.classList.toggle('on',rw===act)});
      while(rows.length&&rows[0].res&&rows[0].y>ah+10){rows.shift().el.remove()}
    }
  };
}

/* ================= Game 3: Yes or No ================= */
function call(){
  const arena=$('#arena');arena.className='arena call';
  arena.innerHTML='<div class="ccard" id="ccard"><div class="cans" id="cans" data-nb></div><div class="cbar"><i id="cbar"></i></div></div><div class="cbtns"><button class="cb yes" data-act="yes">Yes</button><button class="cb no" data-act="no">No</button></div>';
  let cur=null,left=0,dur=5,lock=0;
  const dim=()=>{$('#cans').className='cans'+(String(cur.shown).length>5?' small':'');};
  function next(){
    const q=nextQ();setQ(q);
    const isT=Math.random()<.5;let shown=q.answer;
    if(!isT){const w=choicesFor(q,3).filter(v=>v!==q.answer);if(w.length)shown=pick(w)}
    cur={q,shown,isT:shown===q.answer};
    $('#cans').textContent=shown;dim();$('#ccard').className='ccard';
    dur=Math.max(1.8,(6.2-.55*R.level+(q.text.length>30?2.5:0))/S.pace);left=dur;
  }
  function reveal(){$('#cans').textContent=cur.q.answer;$('#cans').classList.add('rev')}
  function answer(yes){
    if(lock>0||!cur||R.paused)return;
    if(yes===cur.isT){good(cur.q,false);$('#ccard').classList.add('ok');lock=.3}
    else{bad(cur.q,(cur.isT?'That was right. ':'The answer is '+cur.q.answer+'. ')+(cur.q.hint||''),cur.isT?null:cur.shown,cur.isT?'wasRight':'');reveal();lock=1.4}
  }
  next();
  return{
    dbg(){return cur&&lock<=0?{isT:cur.isT}:null},
    answer,
    key(e){
      if(e.key==='ArrowLeft'||e.key==='y'||e.key==='Y'){answer(true);return true}
      if(e.key==='ArrowRight'||e.key==='n'||e.key==='N'){answer(false);return true}
      return false;
    },
    update(dt){
      if(lock>0){lock-=dt;if(lock<=0)next();return}
      if(R.calm){$('#cbar').style.visibility='hidden';return}
      left-=dt;$('#cbar').style.width=Math.max(0,100*left/dur)+'%';
      if(left<=0){bad(cur.q,'Time! The answer is '+cur.q.answer+'.',null,'miss');reveal();lock=1.3}
    }
  };
}

function openCrate(){

    const c=pick(list),had=S.cards[c.id]||0;S.cards[c.id]=had+1;
    let note;if(had){S.coins+=15;note='<span class="dim">You already had this one. +15 coins!</span>'}else note='<b>New card!</b>';
    html='<div class="cardprize">'+cardHTML(c,1)+note+'</div>';

    const tier=rollRarity();let un=PETS.filter(p=>S.pets.indexOf(p.id)<0);const t=un.filter(p=>p.r===tier);if(t.length)un=t;
    const p=pick(un);S.pets.push(p.id);S.pet=p.id;
    html=prizeBox(RAR[p.r].c,'<span class="rar" style="color:'+RAR[p.r].c+'">'+RAR[p.r].n+'</span><span class="pimg big">'+critter(p.s)+'</span><b>New pet: '+p.name+'!</b><span class="dim">It will run beside you in Dash.</span>',p.r!=='common');
  }else if(r<.64&&SKINS.some(k=>S.skins.indexOf(k.id)<0)){
    const tier=rollRarity();let un=SKINS.filter(k=>S.skins.indexOf(k.id)<0);const t=un.filter(k=>k.r===tier);if(t.length)un=t;
    const k=pick(un);S.skins.push(k.id);S.skin=k.id;

  }
  save();setTop();host.innerHTML=html;
}

function parseLines(text){
  const out=[],errs=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim())return;
    const p=line.split('|').map(s=>s.trim());
    if(!p[0]||!p[1]){errs.push('Line '+(i+1)+' needs a question and an answer, separated by |');return}
    const wrong=(p[3]||'').split(';').map(s=>s.trim()).filter(Boolean);
    if(!isNum(p[1])&&wrong.length<2){errs.push('Line '+(i+1)+': add at least 2 wrong answers as a fourth part, for example 4; 6; 10');return}
    out.push({text:p[0],answer:p[1],hint:p[2]||'',wrong:wrong.slice(0,3)});
  });
  return{items:out,errs};
}

  const t=e.target;if(!t.dataset||!t.dataset.f||!ED)return;
  const l=lessonById(ED);if(!l)return;
  if(t.dataset.f==='lname'){l.name=t.value;save();return}
  const i=Number(t.dataset.qi),q=l.questions[i];if(!q)return;
  if(t.dataset.f==='text')q.text=t.value;
  else if(t.dataset.f==='hint')q.hint=t.value;
  else if(t.dataset.f==='why')q.why=t.value;
  else if(t.dataset.f==='opt')q.opts[Number(t.dataset.k)]=t.value;
  syncQ(q);save();
  const st=$('.qcard[data-qi="'+i+'"] .qstate');if(st){const pr=qProblem(q);st.className='qstate '+(pr?'bad':'good');st.textContent=pr||'Ready'}
});


/* ================= events ================= */
const A={
 menu:()=>renderTitle(),
 start:()=>{if(S.seenHero||S.focus)renderHub();else{S.seenHero=true;save();renderHero()}},
 settings:()=>renderSettings(),
 bionic:()=>{S.bionic=!S.bionic;save();setTop()},
 'set-mode':()=>{S.mode=S.mode==='dark'?'light':'dark';save();setTop();renderSettings()},
 'set-bionic':()=>{S.bionic=!S.bionic;save();setTop();renderSettings()},
 'set-child':()=>{S.child=!(S.child!==false);save();setTop();renderSettings()},
 'set-focus':()=>{S.focus=!S.focus;save();setTop();renderSettings()},
 'set-autoread':()=>{S.autoread=!S.autoread;save();renderSettings()},
 timer:t=>{S.timer=t.dataset.v;save();renderHub()},

 speakq:()=>{if(R&&R.cur)speakQ(R.cur);else if(PR)speakQ(PR.qs[PR.i])},

 pskip:()=>{PR.i++;PR.tries=0;PR.ch=null;PR.locked=false;renderPractice()},
 'set-explain':()=>{S.explain=!(S.explain!==false);save();renderSettings()},
 bstr:t=>{S.bstr=Number(t.dataset.v);save();setTop();rebionic();if($('#reader'))renderStory();else renderSettings()},
 learn:()=>{clearLT();renderLearn()},
 lnext:()=>{LS.step++;LS.done=false;lessonStep()},
 lreplay:()=>animate(LS.ex),
 ltap:t=>ltap(t),
 lop:t=>lop(t),
 speak:t=>{try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t.dataset.say||''))}catch(e){toast('Listening is not supported here.')}},
 lesson:t=>renderLesson(t.dataset.id),
 practice:t=>{const l=lessonById(t.dataset.id);if(l)startPractice(lessonQs(l,6),'Practice','learn',l.id)},
 'practice-miss':()=>{const m=Object.keys(S.mistakes).map(k=>Object.assign({key:k,wrong:[]},S.mistakes[k])).sort((a,b)=>b.t-a.t).slice(0,6);startPractice(m,'Review practice','review')},
 'clear-miss':()=>{S.mistakes={};save();renderReview()},
 review:()=>renderReview(),
 pans:t=>pans(t),
 pnext:()=>{PR.i++;PR.tries=0;PR.ch=null;PR.locked=false;renderPractice()},
 read:()=>renderRead(),
 story:t=>{RD_={id:t.dataset.id,i:0,focus:true};renderStory()},
 sgo:t=>{RD_.i=Number(t.dataset.k);renderStory()},
 sprev:()=>{if(RD_.i>0){RD_.i--;renderStory()}},
 snext:()=>{const r=READS.find(x=>x.id===RD_.id);if(RD_.i+1>=r.sents.length){RD_.qs=r.qs;RD_.qi=0;RD_.ok=0;RD_.tried=false;RD_.lock=false;renderQuiz()}else{RD_.i++;renderStory()}},
 rfocus:()=>{RD_.focus=!RD_.focus;renderStory()},
 rsz:t=>{S.rsz=clamp((S.rsz||1)+Number(t.dataset.v),0,3);save();renderStory()},
 listen:()=>{try{const r=READS.find(x=>x.id===RD_.id);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r.sents[RD_.i]);u.rate=.9;speechSynthesis.speak(u)}catch(e){toast('Listening is not supported here.')}},
 qans:t=>qans(t),
 qnext:()=>{RD_.qi++;RD_.tried=false;RD_.lock=false;renderQuiz()},
 'set-sound':()=>{S.sound=!S.sound;save();if(S.sound)beep('tick');renderSettings()},
 teacher:()=>renderTeacher(),
 'to-hub':()=>renderHub(true),
 home:()=>renderHub(),
 more:()=>renderHub(true),
 'play-now':()=>startRound(S.lastMode||'run',false),
 'practice-now':()=>{const out=[],seen=new Set();for(let i=0;i<60&&out.length<8;i++){const q=drawQs(1,false)[0];if(q&&!seen.has(q.text)){seen.add(q.text);out.push(q)}}startPractice(out,'Practice','home')},
 'hear-me':()=>{S.autoread=!S.autoread;save();speakText(S.autoread?'I will read to you.':'Okay.');renderSimple()},
 'stop-all':()=>renderTitle(),
 'to-hero':()=>renderHero(),
 'hero-done':()=>renderHub(),
 'pick-hero':t=>{S.hero=t.dataset.id;save();renderHero()},
 collection:()=>renderCollection(),
 tab:t=>{COL=t.dataset.t;renderCollection()},
 skin:t=>{
   const k=SKINS.find(x=>x.id===t.dataset.id);if(!k)return;
   if(S.skins.indexOf(k.id)>=0){S.skin=k.id;save();renderCollection();return}
   if(S.coins<k.price){toast('You need '+(k.price-S.coins)+' more coins. Play a round to earn them.');return}
   ask({title:'Buy '+k.name+'?',art:'<i class="sw big" style="--sw:'+skinSw(k)+'"></i>',body:'This skin costs <b>'+k.price+' coins</b>. You will have '+(S.coins-k.price)+' coins left.',yes:'Yes, buy it',onYes:()=>{S.coins-=k.price;S.skins.push(k.id);S.skin=k.id;save();setTop();renderCollection();toast(k.name+' skin unlocked!')}});
 },
 pet:t=>{
   const p=PETS.find(x=>x.id===t.dataset.id);if(!p)return;
   if(S.pets.indexOf(p.id)>=0){S.pet=S.pet===p.id?'':p.id;save();renderCollection();return}
   if(S.coins<p.price){toast('You need '+(p.price-S.coins)+' more coins. Play a round to earn them.');return}
   ask({title:'Adopt '+p.name+'?',art:'<span class="pimg big">'+critter(p.s)+'</span>',body:p.name+' costs <b>'+p.price+' coins</b>. You will have '+(S.coins-p.price)+' coins left.',yes:'Yes, adopt',onYes:()=>{S.coins-=p.price;S.pets.push(p.id);S.pet=p.id;save();setTop();renderCollection();toast(p.name+' joined you!')}});
 },
 play:t=>startRound(t.dataset.mode,false),

 crate:()=>openCrate(),
 'toggle-lesson':t=>{const l=S.lessons.filter(x=>x.id===t.dataset.id)[0];if(l){l.active=!l.active;save();renderLessons()}},
 'new-lesson':()=>{const l={id:'l'+Date.now(),name:'New lesson',grade:'',active:true,questions:[blankQ()]};S.lessons.push(l);save();ED=l.id;renderEditor(0)},
 'edit-lesson':t=>{ED=t.dataset.id;renderEditor()},
 'ed-done':()=>{const l=lessonById(ED);if(l){l.questions=l.questions.filter(q=>String(q.text).trim()||q.answer)}save();renderTeacher()},
 'add-q':()=>{const l=lessonById(ED);if(!l)return;l.questions.push(blankQ());save();renderEditor(l.questions.length-1)},
 'add-wp':()=>{const l=lessonById(ED);if(!l)return;const q={text:'Mia has 5 apples. She gets 3 more. How many apples now?',hint:'Put the two groups together',opts:['8','7','9','6'],ci:0,wrong:[],answer:''};syncQ(q);l.questions.push(q);save();renderEditor(l.questions.length-1)},
 'dup-q':t=>{const l=lessonById(ED),i=Number(t.dataset.qi);if(!l||!l.questions[i])return;const c=JSON.parse(JSON.stringify(l.questions[i]));l.questions.splice(i+1,0,c);save();renderEditor(i+1)},
 'del-q':t=>{const l=lessonById(ED),i=Number(t.dataset.qi);if(!l)return;l.questions.splice(i,1);if(!l.questions.length)l.questions.push(blankQ());save();renderEditor()},
 correct:t=>{const l=lessonById(ED),i=Number(t.dataset.qi);if(!l||!l.questions[i])return;const q=l.questions[i];q.ci=Number(t.dataset.k);syncQ(q);save();replaceCard(i)},
 'del-lesson':t=>{
   if(t.dataset.armed){S.lessons=S.lessons.filter(l=>l.id!==t.dataset.id);save();renderLessons();return}
   t.dataset.armed='1';t.textContent='Tap again to delete';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='Delete'}},3000);
 },
 'bulk-add':()=>{
   const l=lessonById(ED),msg=$('#f-msg'),res=parseLines($('#f-bulk').value);msg.className='msg err';
   if(res.errs.length){msg.textContent=res.errs[0];return}
   if(!res.items.length){msg.textContent='Add at least one question line.';return}
   res.items.forEach(x=>{normQ(x);l.questions.push(x)});l.questions=l.questions.filter(q=>String(q.text).trim()||q.answer);save();renderEditor();
   const m2=$('#f-msg');if(m2){m2.className='msg ok';m2.textContent='Added '+res.items.length+' question'+(res.items.length===1?'':'s')+'.'}
 },
 pace:t=>{S.pace=Number(t.dataset.v);save();renderSettings()},
 scan:()=>{SC.stage='start';SC.msg='';renderScan()},
 'scan-again':()=>{SC.stage='start';SC.msg='';SC.raw='';renderScan()},
 'sc-cancel':()=>{SC.stage='start';SC.msg='';renderScan()},
 'sc-save':()=>saveWorksheet(),
 'sc-type':()=>{const ta=$('#sctext');SC.raw=ta?ta.value:'';const items=parseSheet(SC.raw);if(!items.length){SC.msg='I could not find a problem. Write one per line, like 8 + 5.';renderScan();return}SC.items=items;SC.stage='review';SC.msg='';renderScan()},
 'sc-del':t=>{S.lessons=S.lessons.filter(l=>l.id!==t.dataset.id);save();renderScan()},
 'demo-coins':()=>{S.coins+=500;save();setTop();const m=$('#demo-msg');if(m){m.className='msg ok';m.textContent='Added 500 coins.'}},
 reset:()=>{S.coins=400;S.skins=['default'];S.skin='default';S.pets=[];S.pet='';S.cards={};S.stats={};S.best={};S.hero='standard';save();setTop();renderLessons();const m=$('#demo-msg');if(m){m.className='msg ok';m.textContent='Progress reset.'}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=A[t.dataset.act];if(f)f(t,e)});

window.__flick={S:()=>S,R:()=>R,engine:()=>engine,parseSheet,SC:()=>SC,ocrHook:null,aiHook:null};

setTop();bionicTree(document.body);renderTitle();
